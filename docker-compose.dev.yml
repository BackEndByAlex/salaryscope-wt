# Local development — hot reload with Vite dev server + Docusaurus.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build

services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    env_file:
      - .env
    environment:
      DOCS_URL: http://docs:3000
    depends_on:
      - docs
    command: sh -c "npm install && npm run dev -- --host"

  docs:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./docs:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:3000:3000"
    command: sh -c "npm install && npm run start -- --host 0.0.0.0 --port 3000"
