# Production — SPA frontend and Docusaurus docs.
# Caddy is handled by the API server compose on the shared network.
#
# Deploy:
#   docker compose -f docker-compose.prod.yml up --build -d

services:
  frontend:
    build:
      context: .
      args:
        VITE_GRAPHQL_URL: ${VITE_GRAPHQL_URL}
        VITE_API_URL: ${VITE_API_URL}
        VITE_GITHUB_CLIENT_ID: ${VITE_GITHUB_CLIENT_ID}
        VITE_GITHUB_REDIRECT_URI: ${VITE_GITHUB_REDIRECT_URI}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_GOOGLE_REDIRECT_URI: ${VITE_GOOGLE_REDIRECT_URI}
    restart: always
    networks:
      - app-network

  wt-docs:
    build:
      context: .
      dockerfile: Dockerfile.docs
    restart: always
    networks:
      - app-network

networks:
  app-network:
    external: true
    name: salaryscope-network
